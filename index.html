<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Blaster: ALIEN ATTACK</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
    #input-video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* UI */
    #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 5; }
    .hud-top { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; }
    .hud-box {
      border: 2px solid #00ff88; border-radius: 4px; background: rgba(0, 20, 10, 0.8);
      padding: 10px 25px; color: #00ff88; font-size: 24px; font-weight: 900;
      text-shadow: 0 0 10px #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
      font-family: 'Courier New', monospace;
    }
    
    #charge-container {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      width: 300px; height: 20px; background: #111;
      border-radius: 4px; border: 2px solid #555; overflow: hidden;
    }
    #charge-fill {
      width: 0%; height: 100%; background: linear-gradient(90deg, #ffff00, #00ffff, #ff0055);
      box-shadow: 0 0 20px #fff; transition: width 0.05s linear;
    }
    .hud-center { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 14px; }

    /* Loading */
    #loading-screen {
      position: fixed; inset: 0; background: #000; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #0f8; font-family: monospace;
    }
    .loader-bar-bg { width: 80%; max-width: 400px; height: 4px; background: #333; margin: 20px 0; position: relative; }
    .loader-bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #0f8; box-shadow: 0 0 10px #0f8; transition: width 0.3s; }

    /* Menu */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 10; backdrop-filter: blur(8px);
      transition: opacity 0.5s; display: none;
    }
    h1 {
      font-size: 52px; color: #00ff88; font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px #00ff88; margin: 0; letter-spacing: -2px;
    }
    .subtitle { letter-spacing: 5px; color: #00aaff; margin-bottom: 20px; font-weight: bold; }

    .panel { background: rgba(0,20,10,0.8); border: 1px solid #0f8; padding: 20px; border-radius: 4px; width: 85%; max-width: 400px; margin-bottom: 20px; }
    label { color: #0f8; font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; }
    select { width: 100%; padding: 10px; margin-bottom: 15px; background: #000; color: #0f8; border: 1px solid #054; font-size: 16px; font-family: monospace; }
    
    /* チェックボックス周り */
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: #00ff88; cursor: pointer; }
    .checkbox-label { color: #fff; font-size: 16px; font-weight: bold; }

    button {
      padding: 15px 70px; font-size: 24px;
      background: #00ff88; color: #000; border: none; font-weight: 900; cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.6); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    button:active { transform: scale(0.95); background: #fff; }

    .pop-score {
      position: absolute; font-weight: 900; text-shadow: 0 0 10px currentColor;
      animation: blastUp 0.6s forwards ease-out; white-space: nowrap; font-family: 'Courier New', monospace; pointer-events: none;
    }
    @keyframes blastUp {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(1.0); }
    }
    #countdown {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 150px; font-weight: 900; color: #fff; text-shadow: 0 0 50px #0f8; z-index: 20; pointer-events: none; display: none;
    }
  </style>
</head>
<body>

  <div id="loading-screen">
    <h2 style="color:#0f8;">LOADING SYSTEM...</h2>
    <div class="loader-bar-bg"><div class="loader-bar-fill" id="loader-fill"></div></div>
    <div class="loader-text" id="loader-status">INITIALIZING...</div>
  </div>

  <video id="input-video" playsinline muted autoplay></video>

  <div id="ui">
    <div class="hud-top">
      <div class="hud-box">SCORE: <span id="score">0</span></div>
      <div class="hud-box" id="timer-box">TIME: <span id="time">60</span></div>
    </div>
    <div id="charge-text">ENERGY</div>
    <div id="charge-container"><div id="charge-fill"></div></div>
    <div class="hud-center"><span id="status-text">STANDBY</span></div>
  </div>

  <div id="countdown">3</div>

  <div id="overlay">
    <h1>ALIEN ATTACK</h1>
    <div class="subtitle">AR SHOOTER</div>
    <div class="panel">
      <label>MODE</label>
      <select id="opt-mode">
        <option value="time60">⏱️ TIME ATTACK (60s)</option>
        <option value="endless">♾️ ENDLESS</option>
      </select>
      
      <label>DIFFICULTY</label>
      <select id="opt-diff">
        <option value="beginner">🐣 BEGINNER</option>
        <option value="normal" selected>🔥 NORMAL</option>
        <option value="hard">💀 HARD</option>
        <option value="expert">😈 EXPERT</option>
      </select>

      <label>DISPLAY</label>
      <label class="checkbox-group">
        <input type="checkbox" id="opt-fullscreen">
        <span class="checkbox-label">FULLSCREEN MODE</span>
      </label>

      <div style="font-size:12px; color:#0f8; margin-top:10px; border-top:1px solid #054; padding-top:10px;">
        ✊ <strong>CHARGE</strong> (グー)<br>
        ✋ <strong>FIRE</strong> (パー)<br>
        <span style="color:#ff5555;">★MAXチャージでボス(赤)を一撃！</span>
      </div>
    </div>
    <button id="start-btn">START</button>
  </div>

<script>
(function() {
  const $ = id => document.getElementById(id);

  let CONF = { mode: 'time60', maxTargets: 10, spawnInterval: 40, targetSpeed: 0.2, cameraW: 1280, cameraH: 720 };
  let scene, camera, renderer;
  let crosshairMesh, targets = [], particles = [], lasers = [];
  let gridMesh, stars;
  let hands, cameraUtils;
  let gameState = 'loading';
  let score = 0, startTime = 0, timeLimit = 60;
  let aimNDC = { x: 0, y: 0 }, smoothAimNDC = { x: 0, y: 0 };
  let isCharging = false, chargeLevel = 0;
  let texAlien1, texAlien2, texBoss; 
  let audioCtx, chargeSoundNode = null;

  window.onload = function() {
    initAudio(); initThree();
    updateLoader(10, "LOADING MODULES...");
    setTimeout(() => {
      setupHands().then(() => {
        updateLoader(100, "READY");
        setTimeout(() => { $('loading-screen').style.display = 'none'; $('overlay').style.display = 'flex'; gameState = 'ready'; }, 500);
      }).catch(e => { $('loader-status').textContent = "ERROR: " + e; $('loader-fill').style.background = "red"; });
    }, 500);
  };

  function updateLoader(percent, text) { $('loader-fill').style.width = percent + '%'; $('loader-status').textContent = text; }
  function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

  // --- Sound ---
  function startChargeSound() {
    if (!audioCtx || chargeSoundNode) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, t); osc.frequency.linearRampToValueAtTime(400, t + 2.0);
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = 30;
    const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 100;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency); lfo.start(t);
    gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.1, t + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t);
    chargeSoundNode = { osc, gain, lfo };
  }
  function stopChargeSound() {
    if (chargeSoundNode) {
      const t = audioCtx.currentTime;
      chargeSoundNode.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      chargeSoundNode.osc.stop(t + 0.1); chargeSoundNode.lfo.stop(t + 0.1);
      chargeSoundNode = null;
    }
  }
  function playBlastSound(level) {
    if (!audioCtx) return;
    stopChargeSound();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (level >= 100) {
      osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.8); gain.gain.setValueAtTime(0.5, t);
    } else {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.5); gain.gain.setValueAtTime(0.3, t);
    }
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5); osc.start(t); osc.stop(t + 0.5);
  }

  // --- Three.js & Alien Textures ---
  function initThree() {
    if (scene) return;
    scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x000000, 10, 90);
    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 0; camera.position.y = 1;
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    // ドット絵生成
    texAlien1 = createPixelTexture([
      "  X     X  ",
      "   X   X   ",
      "  XXXXXXX  ",
      " XX X X XX ",
      " XXXXXXXXX ",
      "   X   X   ",
      "  X     X  ",
      " X       X "
    ], '#00ff88');

    texAlien2 = createPixelTexture([
      "    XXX    ",
      " XXXXXXXXX ",
      "X XXXXXXX X",
      "XXXXXXXXXXX",
      " X X X X X ",
      "  X     X  "
    ], '#ffff00');

    texBoss = createPixelTexture([
      "X  X   X  X",
      "X  XXXXX  X",
      " XXX X XXX ",
      " XXXXXQXXX ",
      " XXXXXXXXX ",
      "  X  X  X  ",
      " X X   X X "
    ], '#ff3333');

    const aimTex = createEnergyTexture();
    const aimMat = new THREE.SpriteMaterial({ map: aimTex, color: 0xffaa00, transparent: true, blending: THREE.AdditiveBlending });
    crosshairMesh = new THREE.Sprite(aimMat);
    crosshairMesh.scale.set(1.5, 1.5, 1); crosshairMesh.renderOrder = 999; scene.add(crosshairMesh);

    const gridHelper = new THREE.GridHelper(100, 40, 0x00ff88, 0x001100);
    gridHelper.position.y = -5; scene.add(gridHelper); gridMesh = gridHelper;
    createStarField();
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  function createPixelTexture(pattern, color) {
    const s = 128; const c = document.createElement('canvas');
    c.width = s; c.height = s; const ctx = c.getContext('2d');
    const rows = pattern.length; const cols = pattern[0].length;
    const pixelSize = Math.floor(s / Math.max(rows, cols)) * 0.8;
    const offsetX = (s - cols * pixelSize) / 2;
    const offsetY = (s - rows * pixelSize) / 2;
    ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = color;
    for(let y=0; y<rows; y++){
      for(let x=0; x<cols; x++){
        if(pattern[y][x] !== ' ') {
          if(pattern[y][x] === 'Q') ctx.fillStyle = '#fff'; else ctx.fillStyle = color;
          ctx.fillRect(offsetX + x*pixelSize, offsetY + y*pixelSize, pixelSize-2, pixelSize-2);
        }
      }
    }
    return new THREE.CanvasTexture(c);
  }
  function createEnergyTexture() {
    const s = 128; const c = document.createElement('canvas');
    c.width = s; c.height = s; const ctx = c.getContext('2d');
    const cx = s/2, cy = s/2;
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 60);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI*2); ctx.fill();
    return new THREE.CanvasTexture(c);
  }
  function createStarField() {
    const geo = new THREE.BufferGeometry(); const pos = [];
    for(let i=0; i<600; i++) pos.push((Math.random()-0.5)*100, (Math.random()-0.5)*60, -Math.random()*80);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true });
    stars = new THREE.Points(geo, mat); scene.add(stars);
  }
  function createLaserBeam(targetPos, level) {
    const startPos = new THREE.Vector3(0, -2, 2); const endPos = targetPos.clone().normalize().multiplyScalar(80);
    const dist = startPos.distanceTo(endPos);
    let width = 0.3; let color = 0xffff00;
    if (level >= 100) { width = 1.5; color = 0xff0000; } else if (level > 50) { width = 0.6; color = 0x00ffff; }
    const geometry = new THREE.PlaneGeometry(width, dist);
    geometry.rotateX(-Math.PI/2); geometry.translate(0, 0, dist/2);
    const material = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false });
    const mesh1 = new THREE.Mesh(geometry, material);
    const mesh2 = new THREE.Mesh(geometry, material); mesh2.rotation.z = Math.PI/2; mesh1.add(mesh2);
    mesh1.position.copy(startPos); mesh1.lookAt(endPos); scene.add(mesh1);
    lasers.push({ mesh: mesh1, life: 1.0 });
  }

  // === Game Logic ===
  async function setupHands() {
    updateLoader(30, "LOADING AI...");
    hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(results => {
      if (results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        updateAim(lm); checkGesture(lm);
        if (gameState === 'running') $('status-text').textContent = isCharging ? "CHARGING..." : "READY";
      } else stopChargeSound();
    });
    const video = $('input-video');
    cameraUtils = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: CONF.cameraW, height: CONF.cameraH });
    updateLoader(60, "STARTING CAMERA...");
    await cameraUtils.start();
  }

  function updateAim(lm) {
    const wrist = lm[0]; const middle = lm[9];
    aimNDC.x = (1-(wrist.x+middle.x)/2)*2-1; aimNDC.y = (1-(wrist.y+middle.y)/2)*2-1;
    smoothAimNDC.x += (aimNDC.x-smoothAimNDC.x)*0.3; smoothAimNDC.y += (aimNDC.y-smoothAimNDC.y)*0.3;
    let shake = (isCharging ? (chargeLevel/100)*0.1 : 0);
    crosshairMesh.position.set((smoothAimNDC.x+(Math.random()-0.5)*shake)*14, (smoothAimNDC.y+(Math.random()-0.5)*shake)*9, -15);
    crosshairMesh.material.rotation += isCharging ? 0.3 : 0.02;
  }

  function checkGesture(lm) {
    if (gameState !== 'running') { stopChargeSound(); isCharging = false; return; }
    const handSize = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y);
    const tipDist = [8,12,16,20].reduce((sum,i)=>sum+Math.hypot(lm[i].x-lm[0].x, lm[i].y-lm[0].y),0)/4;
    const ratio = tipDist / handSize;
    const bar = $('charge-fill');
    
    if (ratio < 1.0) { // Charge
      if (!isCharging) { isCharging = true; startChargeSound(); }
      chargeLevel = Math.min(100, chargeLevel + 1.5);
      bar.style.width = chargeLevel + '%';
      if(chargeLevel>=100){ bar.style.background='#f00'; crosshairMesh.material.color.setHex(0xff0000); }
      else if(chargeLevel>50){ bar.style.background='#0ff'; crosshairMesh.material.color.setHex(0x00ffff); }
      else { bar.style.background='#ff0'; crosshairMesh.material.color.setHex(0xffff00); }
      crosshairMesh.scale.setScalar(1.5-(chargeLevel/100));
    } else if (ratio > 1.3) { // Fire
      if (isCharging) {
        if (chargeLevel >= 20) fireBlast(chargeLevel);
        isCharging = false; chargeLevel = 0; bar.style.width='0%'; bar.style.background='#ff0'; stopChargeSound();
      }
      crosshairMesh.scale.setScalar(1.5); crosshairMesh.material.color.setHex(0x00ff88);
    }
  }

  function fireBlast(level) {
    playBlastSound(level);
    let power = (level >= 100) ? 50 : (level > 50 ? 3 : 1);
    let isPenetrate = (level >= 100);
    const aimVector = crosshairMesh.position.clone();
    createLaserBeam(aimVector, level);
    crosshairMesh.scale.setScalar(2.0+(level/100)*3); setTimeout(()=>crosshairMesh.scale.setScalar(1.5),100);
    screenShake((level/100)*2);

    let hitCandidates = [];
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const scr = t.position.clone().project(camera);
      const dist = Math.hypot(scr.x-smoothAimNDC.x, scr.y-smoothAimNDC.y);
      if (dist < 0.2 + (level/100)*0.25) hitCandidates.push({i:i, t:t, z:t.position.z});
    }
    hitCandidates.sort((a,b)=>b.z-a.z);

    for (let h of hitCandidates) {
      const t = h.t;
      t.userData.hp -= power;
      if (t.userData.hp <= 0) {
        createExplosion(t.position, true, t.userData.color);
        let pts = (t.userData.type==='boss'?500:100)*(level>=100?2:1);
        showText(t.position, `+${pts}`, "#0f8", 30);
        scene.remove(t); targets.splice(targets.indexOf(t),1); score+=pts; $('score').textContent=score;
      } else {
        createExplosion(t.position, false, t.userData.color);
        t.position.z -= 5; 
      }
      if (!isPenetrate) break;
    }
  }

  $('start-btn').addEventListener('click', () => {
    if (gameState !== 'ready') return;
    applySettings();
    
    // 全画面処理
    if ($('opt-fullscreen').checked) {
      document.documentElement.requestFullscreen().catch(e=>console.log(e));
    }

    $('overlay').style.display='none';
    gameState='counting'; $('countdown').style.display='flex';
    let c=3; $('countdown').textContent=c;
    let tm = setInterval(()=>{ c--; if(c>0)$('countdown').textContent=c; else if(c===0)$('countdown').textContent="GO!"; else { clearInterval(tm); $('countdown').style.display='none'; startRunning(); } }, 1000);
  });

  function startRunning() {
    gameState='running'; score=0; $('score').textContent=0; startTime=performance.now();
    targets.forEach(t=>scene.remove(t)); targets=[]; lasers.forEach(l=>scene.remove(l.mesh)); lasers=[];
  }

  function applySettings() {
    const d = $('opt-diff').value; CONF.mode = $('opt-mode').value;
    if(d==='beginner'){ CONF.maxTargets=3; CONF.spawnInterval=80; CONF.targetSpeed=0.05; }
    else if(d==='normal'){ CONF.maxTargets=8; CONF.spawnInterval=40; CONF.targetSpeed=0.2; }
    else if(d==='hard'){ CONF.maxTargets=12; CONF.spawnInterval=25; CONF.targetSpeed=0.3; }
    else { CONF.maxTargets=18; CONF.spawnInterval=15; CONF.targetSpeed=0.45; }
    $('timer-box').style.display = (CONF.mode==='time60')?'block':'none';
    timeLimit = 60;
  }
  function endGame() {
    gameState='result'; stopChargeSound();
    $('overlay').style.display='flex'; $('overlay').innerHTML=`<h1>MISSION OVER</h1><h2>SCORE: ${score}</h2><button onclick="location.reload()">RETRY</button>`;
  }

  function spawnTarget() {
    if (targets.length >= CONF.maxTargets) return;
    const isBoss = Math.random() < 0.2;
    const type = isBoss ? 'boss' : (Math.random()<0.5?'zako':'speed');
    const hp = isBoss ? 10 : 1; 
    const size = isBoss ? 7 : (type==='speed'?4:5);
    const tex = isBoss ? texBoss : (type==='speed'?texAlien2:texAlien1);
    const color = isBoss ? 0xff3333 : (type==='speed'?0xffff00:0x00ff88);
    
    const mat = new THREE.SpriteMaterial({ map: tex, color: 0xffffff });
    const s = new THREE.Sprite(mat);
    const mt = Math.floor(Math.random()*6);
    let sx, sy, sz;
    if(mt===4){ sx=-80; sy=(Math.random()-0.5)*20; sz=-40; }
    else if(mt===5){ sx=80; sy=(Math.random()-0.5)*20; sz=-40; }
    else { sx=(Math.random()-0.5)*60; sy=(Math.random()-0.5)*30; sz=-50-Math.random()*20; }
    
    s.position.set(sx, sy, sz); s.scale.set(size, size, 1);
    s.userData = { type:type, hp:hp, moveType:mt, startTime:performance.now(), color:color };
    scene.add(s); targets.push(s);
  }

  function createExplosion(pos, isBig, color) {
    for(let i=0; i<(isBig?15:5); i++){
      const mat = new THREE.SpriteMaterial({ color: color || 0xffaa00 });
      const p = new THREE.Sprite(mat); p.position.copy(pos); p.scale.setScalar(0.8);
      p.userData = { vel: new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).multiplyScalar(isBig?1.0:0.5) };
      scene.add(p); particles.push(p);
    }
  }
  function screenShake(i) {
    const o = camera.position.clone(); let f=0;
    function l(){ if(f++>10){camera.position.copy(o);return;} camera.position.x=o.x+(Math.random()-0.5)*i; camera.position.y=o.y+(Math.random()-0.5)*i; requestAnimationFrame(l); } l();
  }
  function showText(pos, t, c, s) {
    const v = pos.clone().project(camera);
    const el = document.createElement('div'); el.className='pop-score'; el.textContent=t;
    el.style.left=(v.x*.5+.5)*innerWidth+'px'; el.style.top=(-(v.y*.5)+.5)*innerHeight+'px';
    el.style.color=c; el.style.fontSize=s+'px'; document.body.appendChild(el); setTimeout(()=>el.remove(),600);
  }

  let fc = 0;
  function animate() {
    requestAnimationFrame(animate);
    if(gridMesh) gridMesh.position.z = (gridMesh.position.z + 1.0) % 10;
    if (gameState !== 'running') return;
    if (CONF.mode === 'time60') {
      const r = Math.max(0, timeLimit - (performance.now()-startTime)/1000);
      $('time').textContent = r.toFixed(1);
      if (r <= 0) { endGame(); return; }
    }
    fc++; if (fc % CONF.spawnInterval === 0) spawnTarget();
    
    const now = performance.now();
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const age = (now - t.userData.startTime)/1000;
      t.position.y += Math.sin(age*5)*0.03; 
      const mt = t.userData.moveType;
      if(mt===4) t.position.x += 0.8; else if(mt===5) t.position.x -= 0.8;
      else t.position.z += CONF.targetSpeed * (1+fc*0.0001);
      if(t.position.z>2 || Math.abs(t.position.x)>100) { scene.remove(t); targets.splice(i,1); }
    }
    particles.forEach((p,i)=>{ p.position.add(p.userData.vel); p.material.opacity-=0.05; if(p.material.opacity<=0){scene.remove(p);particles.splice(i,1);} });
    lasers.forEach((l,i)=>{ l.life-=0.15; l.mesh.scale.x=l.life; l.mesh.material.opacity=l.life; if(l.life<=0){scene.remove(l.mesh);lasers.splice(i,1);} });
    renderer.render(scene, camera);
  }
})();
</script>
