<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Blaster: LASER BEAM</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      margin: 0; background-color: #000; overflow: hidden;
      font-family: 'Segoe UI', sans-serif; user-select: none;
    }
    #input-video {
      position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* UIレイヤー */
    #ui {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 5;
    }
    .hud-top {
      position: absolute; top: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between;
    }
    .hud-box {
      border: 2px solid #00aaff; border-radius: 20px;
      background: rgba(0, 10, 30, 0.8);
      padding: 10px 25px;
      color: #00aaff; font-size: 24px; font-weight: 900;
      text-shadow: 0 0 10px #00aaff;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.4);
    }
    .hud-center {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 16px; text-align: center; font-weight: bold;
      text-shadow: 0 0 5px #fff;
    }
    
    /* チャージバー */
    #charge-bar-container {
      width: 200px; height: 10px; background: #333; margin: 10px auto;
      border-radius: 5px; overflow: hidden; border: 1px solid #555;
    }
    #charge-bar {
      width: 0%; height: 100%; background: #ffaa00;
      box-shadow: 0 0 10px #ffaa00; transition: width 0.1s;
    }

    /* オーバーレイ */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 10; backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 48px; color: #ffcc00; font-style: italic; text-transform: uppercase;
      text-shadow: 0 0 20px #ff6600; margin-bottom: 5px; text-align: center;
    }
    .subtitle { letter-spacing: 5px; color: #00aaff; margin-bottom: 30px; font-weight: bold; }

    .instruction { display: flex; gap: 40px; margin-bottom: 30px; }
    .step { text-align: center; opacity: 1; }
    .step div { font-size: 50px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
    .arrow { font-size: 40px; align-self: center; color: #888; }

    /* 設定パネル */
    .panel {
      background: rgba(0,0,0,0.5); border: 1px solid #444;
      padding: 20px; border-radius: 10px; width: 85%; max-width: 400px; margin-bottom: 20px;
    }
    select {
      width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px;
      background: #111; color: #fff; border: 1px solid #666; border-radius: 5px; font-size: 16px;
    }

    button {
      padding: 15px 60px; font-size: 24px;
      background: linear-gradient(135deg, #ff6600, #ffcc00);
      border: none; border-radius: 50px;
      color: #000; font-weight: 900; cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 100, 0, 0.6);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }

    /* ポップアップスコア */
    .pop-score {
      position: absolute; font-weight: 900;
      text-shadow: 0 0 10px currentColor;
      animation: blastUp 0.8s forwards cubic-bezier(0.1, 0.9, 0.2, 1.0);
      white-space: nowrap; font-family: sans-serif; pointer-events: none;
    }
    @keyframes blastUp {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(2.0); }
    }
  </style>
</head>
<body>

  <video id="input-video" playsinline muted autoplay></video>

  <div id="ui">
    <div class="hud-top">
      <div class="hud-box">SCORE: <span id="score">0</span></div>
      <div class="hud-box" id="timer-box">TIME: <span id="time">60</span></div>
    </div>
    <div class="hud-center">
      <div id="charge-bar-container"><div id="charge-bar"></div></div>
      <span id="status-text">SYSTEM STANDBY</span>
    </div>
  </div>

  <div id="overlay">
    <h1>LASER BLASTER</h1>
    <div class="subtitle">ULTIMATE BEAM EDITION</div>
    
    <div class="instruction">
      <div class="step"><div>✊</div><span style="color:#ffaa00">CHARGE</span></div>
      <div class="arrow">➡</div>
      <div class="step"><div>✋</div><span style="color:#00aaff">LASER!</span></div>
    </div>

    <div class="panel">
      <label style="color:#aaa">GAME MODE</label>
      <select id="opt-mode">
        <option value="time60">⏱️ TIME ATTACK (60s)</option>
        <option value="endless">♾️ ENDLESS SURVIVAL</option>
      </select>
      <label style="color:#aaa">DIFFICULTY</label>
      <select id="opt-diff">
        <option value="easy">🔰 EASY</option>
        <option value="normal" selected>🎮 NORMAL</option>
        <option value="hard">🔥 HARD</option>
      </select>
    </div>

    <button id="start-btn">SUIT UP</button>
  </div>

<script>
(function() {
  const $ = id => document.getElementById(id);

  // === 設定 ===
  let CONF = {
    mode: 'time60',
    maxTargets: 10,
    spawnInterval: 40,
    targetSpeed: 0.2,
    cameraW: 1280, cameraH: 720
  };

  let scene, camera, renderer;
  let crosshairMesh, targets = [], particles = [], lasers = [];
  let gridMesh, stars;
  let hands, cameraUtils;
  let score = 0, isRunning = false;
  let startTime = 0, timeLimit = 60;
  
  // 座標管理
  let aimNDC = { x: 0, y: 0 };
  let smoothAimNDC = { x: 0, y: 0 };
  
  // 状態管理
  let isCharging = false; 
  let chargeLevel = 0;    
  let audioCtx;
  let chargeSoundNode = null;

  // === Audio System ===
  function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function startChargeSound() {
    if (!audioCtx || chargeSoundNode) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(50, t);
    osc.frequency.linearRampToValueAtTime(150, t + 2.0);
    
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 15;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 500;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.start(t);

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.1, t + 0.5);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);

    chargeSoundNode = { osc, gain, lfo };
  }

  function stopChargeSound() {
    if (chargeSoundNode) {
      const t = audioCtx.currentTime;
      chargeSoundNode.gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      chargeSoundNode.osc.stop(t + 0.1);
      chargeSoundNode.lfo.stop(t + 0.1);
      chargeSoundNode = null;
    }
  }

  function playBlastSound() {
    if (!audioCtx) return;
    stopChargeSound();
    
    const t = audioCtx.currentTime;
    // 鋭いレーザー音
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1500, t);
    osc.frequency.exponentialRampToValueAtTime(100, t + 0.4);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
    osc.start(t); osc.stop(t + 0.4);
  }

  function playHitSound() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(400, t);
    osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.1);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  }

  // === Three.js ===
  function initThree() {
    if (scene) return;
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 10, 80);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 0; camera.position.y = 1;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    // 照準
    const aimTex = createEnergyTexture();
    const aimMat = new THREE.SpriteMaterial({ map: aimTex, color: 0xffaa00, transparent: true, blending: THREE.AdditiveBlending });
    crosshairMesh = new THREE.Sprite(aimMat);
    crosshairMesh.scale.set(1.5, 1.5, 1);
    crosshairMesh.renderOrder = 999;
    scene.add(crosshairMesh);

    // 床
    const gridHelper = new THREE.GridHelper(100, 40, 0xffaa00, 0x221100);
    gridHelper.position.y = -5;
    scene.add(gridHelper);
    gridMesh = gridHelper;

    createStarField();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  function createEnergyTexture() {
    const s = 128; const c = document.createElement('canvas');
    c.width = s; c.height = s; const ctx = c.getContext('2d');
    const cx = s/2, cy = s/2;
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 60);
    g.addColorStop(0, 'rgba(255, 255, 255, 1)');
    g.addColorStop(0.5, 'rgba(255, 200, 0, 0.8)');
    g.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI*2); ctx.fill();
    return new THREE.CanvasTexture(c);
  }

  function createTargetTexture() {
    const s = 128; const c = document.createElement('canvas');
    c.width = s; c.height = s; const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(0, 200, 255, 0.2)'; 
    ctx.strokeStyle = '#0af'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s/2, s/2, 50, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(s/2, s/2, 30, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#0af'; ctx.font = '20px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('TARGET', s/2, s/2);
    return new THREE.CanvasTexture(c);
  }
  const targetTex = createTargetTexture();

  function createStarField() {
    const geo = new THREE.BufferGeometry(); const pos = [];
    for(let i=0; i<600; i++) pos.push((Math.random()-0.5)*100, (Math.random()-0.5)*60, -Math.random()*80);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true });
    stars = new THREE.Points(geo, mat);
    scene.add(stars);
  }

  // === レーザーエフェクト生成（軽量版） ===
  function createLaserBeam(targetPos) {
    // 始点（手元あたり）
    const startPos = new THREE.Vector3(0, -2, 2); 
    // 終点（ターゲットの少し奥）
    const endPos = targetPos.clone().normalize().multiplyScalar(50);
    
    // ジオメトリ生成（2枚の板を十字にする）
    const dist = startPos.distanceTo(endPos);
    const geometry = new THREE.PlaneGeometry(0.5, dist);
    geometry.rotateX(-Math.PI / 2); // 寝かせる
    geometry.translate(0, 0, dist / 2); // 軸を端に合わせる

    const material = new THREE.MeshBasicMaterial({ 
      color: 0x00ffff, 
      transparent: true, 
      opacity: 0.8,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const mesh1 = new THREE.Mesh(geometry, material);
    const mesh2 = new THREE.Mesh(geometry, material);
    mesh2.rotation.z = Math.PI / 2; // 十字にする
    mesh1.add(mesh2);

    mesh1.position.copy(startPos);
    mesh1.lookAt(endPos);

    scene.add(mesh1);
    
    // レーザー管理配列に追加
    lasers.push({ mesh: mesh1, life: 1.0 });
  }

  // === Game Logic ===
  function startGame() {
    initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume();
    initThree();
    applySettings();
    score = 0; $('score').textContent = '0';
    if (!hands) {
      setupHands().then(() => setRunningState(true)).catch(e => alert(e));
    } else { setRunningState(true); }
  }

  function applySettings() {
    const mode = $('opt-mode').value;
    const diff = $('opt-diff').value;
    CONF.mode = mode;
    if (diff === 'easy') { CONF.maxTargets = 5; CONF.spawnInterval = 60; CONF.targetSpeed = 0.1; }
    else if (diff === 'normal') { CONF.maxTargets = 10; CONF.spawnInterval = 40; CONF.targetSpeed = 0.2; }
    else if (diff === 'hard') { CONF.maxTargets = 15; CONF.spawnInterval = 25; CONF.targetSpeed = 0.35; }

    if (mode === 'time60') {
      $('timer-box').style.display = 'block'; timeLimit = 60;
    } else {
      $('timer-box').style.display = 'none';
    }
  }

  function setRunningState(state) {
    isRunning = state;
    if (state) {
      $('overlay').style.display = 'none';
      startTime = performance.now();
      targets.forEach(t => scene.remove(t)); targets = [];
      lasers.forEach(l => scene.remove(l.mesh)); lasers = [];
      animate();
    } else {
      stopChargeSound();
      $('overlay').style.display = 'flex';
      $('overlay').innerHTML = `
        <h1>SYSTEM OFFLINE</h1>
        <h2 style="font-size:40px; color:#ffaa00; margin:10px;">SCORE: ${score}</h2>
        <button onclick="location.reload()">RE-INITIALIZE</button>
      `;
    }
  }

  async function setupHands() {
    $('start-btn').textContent = "CALIBRATING..."; $('start-btn').disabled = true;
    hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(results => {
      if (results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        updateAim(lm); 
        checkGesture(lm);
        $('status-text').textContent = isCharging ? "CHARGING..." : "READY TO FIRE";
        $('status-text').style.color = isCharging ? "#ffaa00" : "#00aaff";
      } else {
        $('status-text').textContent = "NO SIGNAL"; $('status-text').style.color = "#888";
        stopChargeSound();
      }
    });
    const video = $('input-video');
    cameraUtils = new Camera(video, {
      onFrame: async () => { if(isRunning) await hands.send({image: video}); },
      width: CONF.cameraW, height: CONF.cameraH
    });
    await cameraUtils.start();
    $('start-btn').disabled = false; $('start-btn').textContent = "SUIT UP";
  }

  function updateAim(lm) {
    const wrist = lm[0]; const middle = lm[9];
    const x = (1 - (wrist.x + middle.x) / 2) * 2 - 1;
    const y = (1 - (wrist.y + middle.y) / 2) * 2 - 1;
    
    aimNDC.x = x; aimNDC.y = y;
    smoothAimNDC.x += (aimNDC.x - smoothAimNDC.x) * 0.3;
    smoothAimNDC.y += (aimNDC.y - smoothAimNDC.y) * 0.3;

    let shakeX = 0, shakeY = 0;
    if (isCharging) {
      shakeX = (Math.random()-0.5) * 0.1;
      shakeY = (Math.random()-0.5) * 0.1;
    }

    const aimVector = new THREE.Vector3((smoothAimNDC.x + shakeX) * 14, (smoothAimNDC.y + shakeY) * 9, -15);
    crosshairMesh.position.copy(aimVector);
    crosshairMesh.material.rotation += isCharging ? 0.2 : 0.02;
  }

  function checkGesture(lm) {
    const handSize = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
    const tips = [8, 12, 16, 20];
    let totalTipDist = 0;
    tips.forEach(i => totalTipDist += Math.hypot(lm[i].x - lm[0].x, lm[i].y - lm[0].y));
    const ratio = (totalTipDist / 4) / handSize;
    const chargeBar = $('charge-bar');

    if (ratio < 1.0) { // CHARGE (Fist)
      if (!isCharging) { isCharging = true; startChargeSound(); }
      chargeLevel = Math.min(100, chargeLevel + 2);
      chargeBar.style.width = chargeLevel + '%';
      chargeBar.style.background = `rgb(255, ${150 + chargeLevel}, 0)`;
      const s = 1.5 - (chargeLevel/100) * 1.0; 
      crosshairMesh.scale.set(s, s, 1);
      crosshairMesh.material.color.setHex(0xffaa00);

    } else if (ratio > 1.3) { // FIRE (Open)
      if (isCharging) {
        fireBlast();
        isCharging = false;
        chargeLevel = 0;
        chargeBar.style.width = '0%';
        stopChargeSound();
      }
      crosshairMesh.scale.set(1.5, 1.5, 1);
      crosshairMesh.material.color.setHex(0x00aaff);
    }
  }

  function fireBlast() {
    playBlastSound();
    screenShake(1.0);

    // ★レーザー生成★
    const aimVector = new THREE.Vector3(smoothAimNDC.x * 14, smoothAimNDC.y * 9, -15);
    createLaserBeam(aimVector);

    // ビーム演出
    crosshairMesh.scale.set(4.0, 4.0, 1);
    crosshairMesh.material.color.setHex(0xffffff);
    setTimeout(() => crosshairMesh.scale.set(1.5, 1.5, 1), 100);

    // Hit Detection
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const targetScreenPos = t.position.clone().project(camera);
      const distOnScreen = Math.hypot(targetScreenPos.x - smoothAimNDC.x, targetScreenPos.y - smoothAimNDC.y);

      if (distOnScreen < 0.2) {
        const distZ = t.position.z;
        let points = 100;
        let label = "HIT! +100";
        let color = "#00aaff"; 
        let size = 30;

        if (distZ < -35) { points = 300; label = "SNIPE! +300"; color = "#ffaa00"; size = 40; }
        else if (distZ > -8) { points = 500; label = "SMASH!! +500"; color = "#ff0055"; size = 50; }

        createExplosion(t.position);
        showFloatingText(t.position, label, color, size);
        
        scene.remove(t); targets.splice(i, 1);
        score += points; $('score').textContent = score;
        playHitSound();
      }
    }
  }

  function screenShake(intensity = 0.5) {
    const originalPos = camera.position.clone();
    let shakeFrame = 0;
    function shake() {
      if (shakeFrame > 15) { camera.position.copy(originalPos); return; }
      camera.position.x = originalPos.x + (Math.random() - 0.5) * intensity;
      camera.position.y = originalPos.y + (Math.random() - 0.5) * intensity;
      intensity *= 0.9;
      shakeFrame++; requestAnimationFrame(shake);
    }
    shake();
  }

  function showFloatingText(pos, text, color, size) {
    const vec = pos.clone(); vec.project(camera);
    const x = (vec.x * .5 + .5) * window.innerWidth;
    const y = (-(vec.y * .5) + .5) * window.innerHeight;
    const el = document.createElement('div');
    el.className = 'pop-score';
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.color = color; el.style.fontSize = size + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function spawnTarget() {
    if (targets.length >= CONF.maxTargets) return;
    const mat = new THREE.SpriteMaterial({ map: targetTex, color: 0xffffff });
    const sprite = new THREE.Sprite(mat);
    sprite.position.set((Math.random()-0.5)*25, (Math.random()-0.5)*15, -50);
    sprite.scale.set(4, 4, 1);
    scene.add(sprite);
    targets.push(sprite);
  }

  function createExplosion(pos) {
    for(let i=0; i<12; i++){
      const mat = new THREE.SpriteMaterial({ color: 0xffaa00 });
      const p = new THREE.Sprite(mat);
      p.position.copy(pos); p.scale.set(0.8, 0.8, 1);
      p.userData = { vel: new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5)).multiplyScalar(0.8) };
      scene.add(p); particles.push(p);
    }
  }

  let frameCount = 0;
  function animate() {
    if (!isRunning) return;
    requestAnimationFrame(animate);

    if (CONF.mode === 'time60') {
      const elapsed = (performance.now() - startTime) / 1000;
      const remain = Math.max(0, timeLimit - elapsed);
      $('time').textContent = remain.toFixed(1);
      if (remain <= 0) { setRunningState(false); return; }
    }

    if(gridMesh) gridMesh.position.z = (gridMesh.position.z + 0.8) % 10;

    frameCount++;
    if (frameCount % CONF.spawnInterval === 0) spawnTarget();

    // ターゲット更新
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      t.position.z += CONF.targetSpeed * (1 + frameCount % 200 * 0.01); 
      t.material.rotation -= 0.05;
      if (t.position.z > 2) { scene.remove(t); targets.splice(i, 1); }
    }

    // パーティクル更新
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.position.add(p.userData.vel);
      p.material.opacity -= 0.04;
      p.scale.multiplyScalar(0.9);
      if (p.material.opacity <= 0) { scene.remove(p); particles.splice(i, 1); }
    }

    // ★レーザー更新（一瞬で消えるアニメーション）
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.life -= 0.1; // 寿命を減らす
      
      // 細くする
      l.mesh.scale.x = l.life; 
      l.mesh.material.opacity = l.life;

      if (l.life <= 0) {
        scene.remove(l.mesh);
        l.mesh.geometry.dispose(); // メモリ解放
        lasers.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  $('start-btn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
