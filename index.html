<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>AR Blaster: DEFENDER</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
    * { -webkit-tap-highlight-color: transparent; }
    
    #input-video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* UI Layer */
    #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
    
    .hud-top {
      position: absolute; top: env(safe-area-inset-top, 20px); left: 20px; right: 20px;
      display: flex; justify-content: space-between;
    }
    .hud-box {
      border: 2px solid #00ff88; border-radius: 4px; background: rgba(0, 20, 10, 0.8);
      padding: 10px 20px; color: #00ff88; font-size: 20px; font-weight: 900;
      text-shadow: 0 0 10px #00ff88; font-family: 'Courier New', monospace;
    }
    /* HP Bar */
    #hp-container {
      width: 200px; height: 20px; background: #330000; border: 2px solid #ff0000;
      margin-top: 5px; position: relative;
    }
    #hp-fill {
      width: 100%; height: 100%; background: #ff0000; transition: width 0.2s;
      box-shadow: 0 0 10px #ff0000;
    }
    
    /* Charge Bar */
    #charge-container {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      width: 250px; height: 15px; background: #111;
      border-radius: 4px; border: 2px solid #555; overflow: hidden;
    }
    #charge-fill {
      width: 0%; height: 100%; background: linear-gradient(90deg, #ffff00, #00ffff, #ff0055);
      box-shadow: 0 0 20px #fff; transition: width 0.05s linear;
    }
    .hud-center { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 14px; text-align: center;}

    /* Shield Effect */
    #shield-overlay {
      position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.2s;
      background: radial-gradient(circle, transparent 30%, rgba(0, 100, 255, 0.4) 90%);
      box-shadow: inset 0 0 50px #00aaff;
      display: flex; align-items: center; justify-content: center;
    }
    #shield-overlay.active { opacity: 1; }
    #shield-text {
      color: #00aaff; font-size: 40px; font-weight: 900; letter-spacing: 10px;
      text-shadow: 0 0 20px #00aaff; border: 4px solid #00aaff; padding: 20px;
      transform: rotate(-5deg); background: rgba(0, 20, 50, 0.8);
    }

    /* Damage Effect */
    #damage-overlay {
      position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, transparent 50%, rgba(255, 0, 0, 0.6) 100%);
      transition: opacity 0.1s;
    }

    /* Loading & Menu */
    #loading-screen {
      position: fixed; inset: 0; background: #000; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #0f8; font-family: monospace;
    }
    .loader-bar-bg { width: 80%; max-width: 400px; height: 4px; background: #333; margin: 20px 0; }
    .loader-bar-fill { height: 100%; width: 0%; background: #0f8; box-shadow: 0 0 10px #0f8; transition: width 0.3s; }

    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; z-index: 30; backdrop-filter: blur(8px); transition: opacity 0.5s; display: none;
    }
    h1 { font-size: 10vw; max-font-size: 52px; color: #00ff88; margin: 0; font-family: 'Courier New', monospace; text-shadow: 0 0 20px #00ff88; }
    .subtitle { letter-spacing: 5px; color: #00aaff; margin-bottom: 20px; font-weight: bold; }

    .panel { background: rgba(0,20,10,0.8); border: 1px solid #0f8; padding: 20px; border-radius: 4px; width: 85%; max-width: 400px; margin-bottom: 20px; }
    label { color: #0f8; font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; }
    select { width: 100%; padding: 10px; margin-bottom: 15px; background: #000; color: #0f8; border: 1px solid #054; font-size: 16px; }
    
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer; border: 1px solid #054; padding: 10px; border-radius: 4px; background: #001; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: #00ff88; }
    .checkbox-label { font-weight: bold; color: #fff; }

    button {
      padding: 15px 60px; font-size: 24px; background: #00ff88; color: #000; border: none; font-weight: 900; cursor: pointer;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.6); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    button:active { transform: scale(0.95); background: #fff; }

    /* Pop Score */
    .pop-score { position: absolute; font-weight: 900; text-shadow: 0 0 10px currentColor; animation: blastUp 0.6s forwards ease-out; pointer-events: none; }
    @keyframes blastUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { opacity: 0; transform: translate(-50%, -100%) scale(1.0); } }
    
    #countdown { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 150px; font-weight: 900; color: #fff; text-shadow: 0 0 50px #0f8; z-index: 40; pointer-events: none; display: none; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <h2 style="color:#0f8;">SYSTEM BOOT</h2>
    <div class="loader-bar-bg"><div class="loader-bar-fill" id="loader-fill"></div></div>
    <div class="loader-text" id="loader-status">INITIALIZING...</div>
  </div>

  <div id="shield-overlay">
    <div id="shield-text">SHIELD ACTIVE</div>
  </div>
  <div id="damage-overlay"></div>

  <video id="input-video" playsinline muted autoplay></video>

  <div id="ui">
    <div class="hud-top">
      <div>
        <div class="hud-box">SCORE: <span id="score">0</span></div>
        <div id="hp-container"><div id="hp-fill"></div></div>
      </div>
      <div class="hud-box" id="timer-box">TIME: <span id="time">60</span></div>
    </div>
    
    <div id="charge-text" style="color:#aaa; text-align:center; position:absolute; bottom:100px; width:100%;">ENERGY</div>
    <div id="charge-container"><div id="charge-fill"></div></div>
    <div class="hud-center"><span id="status-text">STANDBY</span></div>
  </div>

  <div id="countdown">3</div>

  <div id="overlay">
    <h1>ALIEN ATTACK</h1>
    <div class="subtitle">DEFENDER EDITION</div>
    <div class="panel">
      <label>MODE</label>
      <select id="opt-mode">
        <option value="time60">⏱️ TIME ATTACK (60s)</option>
        <option value="endless">♾️ ENDLESS</option>
      </select>
      <label>DIFFICULTY</label>
      <select id="opt-diff">
        <option value="beginner">🐣 BEGINNER</option>
        <option value="normal" selected>🔥 NORMAL</option>
        <option value="hard">💀 HARD</option>
        <option value="expert">😈 EXPERT</option>
      </select>
      
      <label class="checkbox-group" style="border-color:#ff4444; background:#200;">
        <input type="checkbox" id="opt-attack" checked>
        <span class="checkbox-label" style="color:#ffaaaa;">ENEMY ATTACKS (Guard Mode)</span>
      </label>

      <label class="checkbox-group">
        <input type="checkbox" id="opt-fullscreen">
        <span class="checkbox-label">FULLSCREEN MODE</span>
      </label>

      <div style="font-size:12px; color:#aaa; margin-top:10px;">
        ✋手が見える: <strong>ATTACK</strong><br>
        🚫手がない: <strong>GUARD (SHIELD)</strong><br>
      </div>
    </div>
    <button id="start-btn">START</button>
  </div>

<script>
(function() {
  const $ = id => document.getElementById(id);

  let CONF = { mode: 'time60', maxTargets: 10, spawnInterval: 40, targetSpeed: 0.2, enemyAttack: true, cameraW: 1280, cameraH: 720 };
  let scene, camera, renderer;
  let crosshairMesh, targets = [], particles = [], lasers = [], enemyBullets = [];
  let gridMesh, stars;
  let hands, cameraUtils;
  
  let gameState = 'loading';
  let score = 0, hp = 100, maxHp = 100;
  let startTime = 0, timeLimit = 60;
  
  let aimNDC = { x: 0, y: 0 }, smoothAimNDC = { x: 0, y: 0 };
  let isCharging = false, chargeLevel = 0, isHandDetected = false;
  let texAlien1, texAlien2, texBoss; 
  let audioCtx, chargeSoundNode = null;

  window.onload = function() {
    initAudio(); initThree();
    updateLoader(10, "LOADING MODULES...");
    setTimeout(() => {
      setupHands().then(() => {
        updateLoader(100, "READY");
        setTimeout(() => { $('loading-screen').style.display = 'none'; $('overlay').style.display = 'flex'; gameState = 'ready'; }, 500);
      }).catch(e => { $('loader-status').textContent = "ERROR: " + e; $('loader-fill').style.background = "red"; });
    }, 500);
  };

  function updateLoader(percent, text) { $('loader-fill').style.width = percent + '%'; $('loader-status').textContent = text; }
  function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

  // Sound
  function playSound(type) {
    if(!audioCtx) return; if(audioCtx.state==='suspended') audioCtx.resume();
    const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if(type==='shield_hit'){
      osc.type='sine'; osc.frequency.setValueAtTime(200,t); osc.frequency.linearRampToValueAtTime(100,t+0.1);
      gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1);
      osc.start(t); osc.stop(t+0.1);
    } else if(type==='damage'){
      osc.type='sawtooth'; osc.frequency.setValueAtTime(100,t); osc.frequency.exponentialRampToValueAtTime(10,t+0.3);
      gain.gain.setValueAtTime(0.5,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3);
      osc.start(t); osc.stop(t+0.3);
    } else if(type==='shield_on'){
      osc.type='triangle'; osc.frequency.setValueAtTime(100,t); osc.frequency.linearRampToValueAtTime(300,t+0.3);
      gain.gain.setValueAtTime(0.1,t); gain.gain.linearRampToValueAtTime(0,t+0.3);
      osc.start(t); osc.stop(t+0.3);
    }
  }
  // (Charge sound logic same as before, simplified for space)
  function startChargeSound(){ if(!audioCtx||chargeSoundNode)return; const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.value=60; o.frequency.linearRampToValueAtTime(400,t+2); g.gain.value=0; g.gain.linearRampToValueAtTime(0.1,t+0.2); o.connect(g); g.connect(audioCtx.destination); o.start(t); chargeSoundNode={osc:o,gain:g}; }
  function stopChargeSound(){ if(chargeSoundNode){ chargeSoundNode.gain.gain.setTargetAtTime(0,audioCtx.currentTime,0.05); chargeSoundNode.osc.stop(audioCtx.currentTime+0.1); chargeSoundNode=null; } }
  function playBlastSound(lv){ if(!audioCtx)return; stopChargeSound(); const t=audioCtx.currentTime; const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); if(lv>=100){o.type='square';o.frequency.value=150;o.frequency.expRampToValueAtTime(40,t+0.8);g.gain.value=0.5;}else{o.type='sawtooth';o.frequency.value=800;o.frequency.expRampToValueAtTime(100,t+0.5);g.gain.value=0.3;} g.gain.expRampToValueAtTime(0.01,t+0.5); o.start(t); o.stop(t+0.5); }

  // Three.js
  function initThree() {
    if (scene) return;
    scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x000000, 10, 90);
    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 0; camera.position.y = 1;
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    // Textures
    const makeTex = (p,c) => {
      const s=64, cv=document.createElement('canvas'); cv.width=s; cv.height=s; const ctx=cv.getContext('2d');
      const z=Math.floor(s/p.length); const ox=(s-p[0].length*z)/2; ctx.fillStyle=c; ctx.shadowBlur=5; ctx.shadowColor=c;
      p.forEach((r,y)=>{ for(let x=0;x<r.length;x++) if(r[x]!==' ') ctx.fillRect(ox+x*z, ox+y*z, z-1, z-1); });
      return new THREE.CanvasTexture(cv);
    };
    texAlien1 = makeTex(["  X  X  "," XXXXXX ","XX XX XX","XXXXXXXX"," X XX X ","X      X"], '#0f8');
    texAlien2 = makeTex(["   XX   "," XXXXXX ","XXXXXXXX"," X XX X ","  X  X  "], '#ff0');
    texBoss = makeTex(["X X  X X"," XXXXXX ","XXXXXXXX"," XXXXXX ","  X  X  "], '#f33');

    const aimTex = (()=>{const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,5,32,32,30);g.addColorStop(0,'#fff');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(32,32,30,0,7);x.fill();return new THREE.CanvasTexture(c)})();
    const aimMat = new THREE.SpriteMaterial({ map: aimTex, color: 0xffaa00, transparent: true, blending: THREE.AdditiveBlending });
    crosshairMesh = new THREE.Sprite(aimMat);
    crosshairMesh.scale.set(1.5, 1.5, 1); crosshairMesh.renderOrder = 999; scene.add(crosshairMesh);

    const gridHelper = new THREE.GridHelper(100, 40, 0x00ff88, 0x001100);
    gridHelper.position.y = -5; scene.add(gridHelper); gridMesh = gridHelper;
    
    // Stars
    const geo = new THREE.BufferGeometry(); const pos = [];
    for(let i=0; i<600; i++) pos.push((Math.random()-0.5)*100, (Math.random()-0.5)*60, -Math.random()*80);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true });
    stars = new THREE.Points(geo, mat); scene.add(stars);

    animate();
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  }

  // Laser
  function createLaser(pos, lv) {
    const start = new THREE.Vector3(0,-2,2); const end = pos.clone().normalize().multiplyScalar(80);
    const dist = start.distanceTo(end);
    let w = (lv>=100?1.5:(lv>50?0.6:0.3)); let c = (lv>=100?0xff0000:(lv>50?0x00ffff:0xffff00));
    const geo = new THREE.PlaneGeometry(w, dist); geo.rotateX(-Math.PI/2); geo.translate(0,0,dist/2);
    const mat = new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:0.9, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
    const m1 = new THREE.Mesh(geo,mat); const m2 = new THREE.Mesh(geo,mat); m2.rotation.z=Math.PI/2; m1.add(m2);
    m1.position.copy(start); m1.lookAt(end); scene.add(m1); lasers.push({m:m1, l:1.0});
  }

  // Hands
  async function setupHands() {
    hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(r => {
      // 認識判定
      if (r.multiHandLandmarks && r.multiHandLandmarks.length > 0) {
        if (!isHandDetected && gameState==='running') { 
          $('shield-overlay').classList.remove('active'); // ガード解除
          $('status-text').textContent = "READY"; $('status-text').style.color = "#0f8";
        }
        isHandDetected = true;
        const lm = r.multiHandLandmarks[0];
        updateAim(lm); checkGesture(lm);
      } else {
        if (isHandDetected && gameState==='running') {
          // 手が消えた瞬間 -> ガード開始
          $('shield-overlay').classList.add('active'); 
          $('status-text').textContent = "SHIELD ACTIVE"; $('status-text').style.color = "#0af";
          stopChargeSound(); isCharging=false; chargeLevel=0; $('charge-fill').style.width='0%';
          playSound('shield_on');
        }
        isHandDetected = false;
      }
    });
    const video = $('input-video');
    cameraUtils = new Camera(video, { onFrame: async () => { await hands.send({image: video}); }, width: CONF.cameraW, height: CONF.cameraH });
    await cameraUtils.start();
  }

  function updateAim(lm) {
    const wrist = lm[0]; const middle = lm[9];
    aimNDC.x = (1-(wrist.x+middle.x)/2)*2-1; aimNDC.y = (1-(wrist.y+middle.y)/2)*2-1;
    smoothAimNDC.x += (aimNDC.x-smoothAimNDC.x)*0.3; smoothAimNDC.y += (aimNDC.y-smoothAimNDC.y)*0.3;
    let shake = (isCharging ? (chargeLevel/100)*0.1 : 0);
    crosshairMesh.position.set((smoothAimNDC.x+(Math.random()-0.5)*shake)*14, (smoothAimNDC.y+(Math.random()-0.5)*shake)*9, -15);
    crosshairMesh.material.rotation += isCharging ? 0.3 : 0.02;
  }

  function checkGesture(lm) {
    if (gameState !== 'running') { stopChargeSound(); isCharging = false; return; }
    const size = Math.hypot(lm[0].x-lm[9].x, lm[0].y-lm[9].y);
    const dist = [8,12,16,20].reduce((s,i)=>s+Math.hypot(lm[i].x-lm[0].x, lm[i].y-lm[0].y),0)/4;
    const ratio = dist / size;
    const bar = $('charge-fill');
    
    if (ratio < 1.0) { // Charge
      if (!isCharging) { isCharging = true; startChargeSound(); }
      chargeLevel = Math.min(100, chargeLevel + 1.5);
      bar.style.width = chargeLevel + '%';
      const c = chargeLevel>=100?0xff0000:(chargeLevel>50?0x00ffff:0xffff00);
      bar.style.background = chargeLevel>=100?'#f00':(chargeLevel>50?'#0ff':'#ff0');
      crosshairMesh.material.color.setHex(c);
      crosshairMesh.scale.setScalar(1.5-(chargeLevel/100));
    } else if (ratio > 1.3) { // Fire
      if (isCharging) {
        if (chargeLevel >= 20) fireBlast(chargeLevel);
        isCharging = false; chargeLevel = 0; bar.style.width='0%'; stopChargeSound();
      }
      crosshairMesh.scale.setScalar(1.5); crosshairMesh.material.color.setHex(0x00ff88);
    }
  }

  function fireBlast(lv) {
    playBlastSound(lv);
    let p = (lv>=100?50:(lv>50?3:1));
    createLaser(crosshairMesh.position, lv);
    screenShake((lv/100)*2);

    let hits = [];
    targets.forEach((t,i) => {
      const s = t.position.clone().project(camera);
      if (Math.hypot(s.x-smoothAimNDC.x, s.y-smoothAimNDC.y) < 0.25) hits.push({t:t, i:i, z:t.position.z});
    });
    hits.sort((a,b)=>b.z-a.z);

    for (let h of hits) {
      const t = h.t; t.userData.hp -= p;
      if (t.userData.hp <= 0) {
        createExplosion(t.position, true, t.userData.color);
        let pts = (t.userData.type==='boss'?500:100)*(lv>=100?2:1);
        showText(t.position, `+${pts}`, "#0f8", 30);
        scene.remove(t); targets.splice(targets.indexOf(t),1); score+=pts; $('score').textContent=score;
      } else {
        createExplosion(t.position, false, t.userData.color); t.position.z -= 5;
      }
      if (lv<100) break;
    }
  }

  // --- Main Logic ---
  $('start-btn').addEventListener('click', () => {
    if ($('opt-fullscreen').checked) {
      const d = document.documentElement;
      if (d.requestFullscreen) d.requestFullscreen();
      else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    }
    if (gameState !== 'ready') return;
    
    // 設定読み込み
    CONF.mode = $('opt-mode').value;
    CONF.enemyAttack = $('opt-attack').checked;
    const d = $('opt-diff').value;
    if(d==='beginner'){CONF.maxTargets=3; CONF.spawnInterval=80; CONF.targetSpeed=0.05;}
    else if(d==='normal'){CONF.maxTargets=8; CONF.spawnInterval=40; CONF.targetSpeed=0.2;}
    else if(d==='hard'){CONF.maxTargets=12; CONF.spawnInterval=25; CONF.targetSpeed=0.3;}
    else{CONF.maxTargets=18; CONF.spawnInterval=15; CONF.targetSpeed=0.45;}
    
    $('timer-box').style.display = (CONF.mode==='time60')?'block':'none';
    timeLimit = 60; hp = 100; updateHP();
    
    $('overlay').style.display='none';
    gameState='counting'; $('countdown').style.display='flex';
    let c=3; $('countdown').textContent=c;
    let tm = setInterval(()=>{ c--; if(c>0)$('countdown').textContent=c; else if(c===0)$('countdown').textContent="GO!"; else { clearInterval(tm); $('countdown').style.display='none'; startRunning(); } }, 1000);
  });

  function startRunning() {
    gameState='running'; score=0; $('score').textContent=0; startTime=performance.now();
    targets.forEach(t=>scene.remove(t)); targets=[]; 
    lasers.forEach(l=>scene.remove(l.m)); lasers=[];
    enemyBullets.forEach(b=>scene.remove(b)); enemyBullets=[];
    // 手が見えてなければシールドON
    if(!isHandDetected) $('shield-overlay').classList.add('active');
  }

  function endGame() {
    gameState='result'; stopChargeSound();
    $('overlay').style.display='flex'; $('overlay').innerHTML=`<h1>GAME OVER</h1><h2>SCORE: ${score}</h2><button onclick="location.reload()">RETRY</button>`;
  }

  function updateHP(){ 
    $('hp-fill').style.width = hp + '%'; 
    if(hp<=0) endGame(); 
  }

  function spawnTarget() {
    if (targets.length >= CONF.maxTargets) return;
    const isBoss = Math.random() < 0.2;
    const type = isBoss ? 'boss' : (Math.random()<0.5?'zako':'speed');
    const mat = new THREE.SpriteMaterial({ map: isBoss?texBoss:(type==='speed'?texAlien2:texAlien1), color: 0xffffff });
    const s = new THREE.Sprite(mat);
    const mt = Math.floor(Math.random()*6);
    let sx, sy, sz;
    if(mt===4){sx=-80;sy=(Math.random()-.5)*20;sz=-40;} else if(mt===5){sx=80;sy=(Math.random()-.5)*20;sz=-40;} else {sx=(Math.random()-.5)*60;sy=(Math.random()-.5)*30;sz=-50-Math.random()*20;}
    s.position.set(sx, sy, sz); s.scale.setScalar(isBoss?7:(type==='speed'?4:5));
    s.userData = { type:type, hp:(isBoss?10:1), moveType:mt, startTime:performance.now(), color:(isBoss?0xf33:(type==='speed'?0xff0:0x0f8)) };
    scene.add(s); targets.push(s);
  }

  function spawnEnemyBullet(origin) {
    if(!CONF.enemyAttack) return;
    const geo = new THREE.SphereGeometry(0.5, 8, 8);
    const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const b = new THREE.Mesh(geo, mat);
    b.position.copy(origin);
    // プレイヤー(0,0,0)へ向かうベクトル
    b.userData = { vel: new THREE.Vector3(0,0,5).sub(origin).normalize().multiplyScalar(0.4) };
    scene.add(b); enemyBullets.push(b);
  }

  function createExplosion(pos, isBig, color) {
    for(let i=0; i<(isBig?15:5); i++){
      const p = new THREE.Sprite(new THREE.SpriteMaterial({ color: color||0xffaa00 })); 
      p.position.copy(pos); p.scale.setScalar(0.8);
      p.userData = { vel: new THREE.Vector3((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)).multiplyScalar(isBig?1:0.5) };
      scene.add(p); particles.push(p);
    }
  }
  function screenShake(i) {
    const o = camera.position.clone(); let f=0;
    function l(){ if(f++>10){camera.position.copy(o);return;} camera.position.set(o.x+(Math.random()-.5)*i, o.y+(Math.random()-.5)*i, o.z); requestAnimationFrame(l); } l();
  }
  function showText(pos, t, c, s) {
    const v = pos.clone().project(camera);
    const el = document.createElement('div'); el.className='pop-score'; el.textContent=t;
    el.style.left=(v.x*.5+.5)*innerWidth+'px'; el.style.top=(-(v.y*.5)+.5)*innerHeight+'px';
    el.style.color=c; el.style.fontSize=s+'px'; document.body.appendChild(el); setTimeout(()=>el.remove(),600);
  }

  let fc = 0;
  function animate() {
    requestAnimationFrame(animate);
    if(gridMesh) gridMesh.position.z = (gridMesh.position.z + 1.0) % 10;
    if (gameState !== 'running') return;
    
    if (CONF.mode === 'time60') {
      const r = Math.max(0, timeLimit - (performance.now()-startTime)/1000);
      $('time').textContent = r.toFixed(1);
      if (r <= 0) { endGame(); return; }
    }
    
    fc++; if (fc % CONF.spawnInterval === 0) spawnTarget();
    
    // 敵の弾発射 (難易度依存)
    if (Math.random() < (CONF.targetSpeed * 0.1)) {
      if(targets.length>0) spawnEnemyBullet(targets[Math.floor(Math.random()*targets.length)].position);
    }

    const now = performance.now();
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const age = (now - t.userData.startTime)/1000;
      t.position.y += Math.sin(age*5)*0.03; 
      const mt = t.userData.moveType;
      if(mt===4) t.position.x += 0.8; else if(mt===5) t.position.x -= 0.8;
      else t.position.z += CONF.targetSpeed * (1+fc*0.0001);
      if(t.position.z>2 || Math.abs(t.position.x)>100) { scene.remove(t); targets.splice(i,1); }
    }

    // 敵弾更新 & 当たり判定
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.position.add(b.userData.vel);
      // プレイヤーに接近
      if (b.position.z > -1) {
        if (!isHandDetected) {
          // ガード成功
          playSound('shield_hit');
        } else {
          // 被弾
          playSound('damage');
          hp -= 10; updateHP();
          const d = $('damage-overlay'); d.style.opacity = 1; setTimeout(()=>d.style.opacity=0, 100);
          screenShake(0.5);
        }
        scene.remove(b); enemyBullets.splice(i, 1);
      } else if (b.position.z < -60) {
        scene.remove(b); enemyBullets.splice(i, 1);
      }
    }

    particles.forEach((p,i)=>{ p.position.add(p.userData.vel); p.material.opacity-=0.05; if(p.material.opacity<=0){scene.remove(p);particles.splice(i,1);} });
    lasers.forEach((l,i)=>{ l.life-=0.15; l.m.scale.x=l.life; l.m.material.opacity=l.life; if(l.life<=0){scene.remove(l.m);lasers.splice(i,1);} });
    renderer.render(scene, camera);
  }
})();
</script>
</body>
</html>
